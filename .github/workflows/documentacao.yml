name: Documentação (opcional, por caminhos)

# Aqui o filtro "paths" é seguro porque este check NÃO é obrigatório.
on:
  pull_request:
    paths:
      - '**.md'
      - 'prompts/**'

permissions:
  contents: read

jobs:
  documentos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            prompts
      - run: echo "Documentação ou prompts alterados - pedir revisão humana."
