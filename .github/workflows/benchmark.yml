name: Benchmark de checkout (antes x depois)

# Compara checkout completo (antes) com raso + esparso (depois), 3 execuções cada,
# sempre no mesmo commit. Rode pelo botão "Run workflow" ou abrindo um PR.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  medir:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repeticao: [1, 2, 3]
        modo: [antes, depois]
    env:
      COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Marcar início
        run: echo "INICIO_NS=$(date +%s%N)" >> "$GITHUB_ENV"

      - name: Checkout completo (antes)
        if: matrix.modo == 'antes'
        uses: actions/checkout@v7
        with:
          ref: ${{ env.COMMIT }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout enxuto (depois)
        if: matrix.modo == 'depois'
        uses: actions/checkout@v7
        with:
          ref: ${{ env.COMMIT }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            apps/api
            scripts

      - name: Marcar fim do checkout
        run: echo "FIM_CHECKOUT_NS=$(date +%s%N)" >> "$GITHUB_ENV"

      - name: Mesmo trabalho nos dois modos
        run: node scripts/validar.cjs apps/api

      - name: Registrar medição
        env:
          MODO: ${{ matrix.modo }}
          REPETICAO: ${{ matrix.repeticao }}
        run: |
          fim=$(date +%s%N)
          checkout_ms=$(( (FIM_CHECKOUT_NS - INICIO_NS) / 1000000 ))
          total_ms=$(( (fim - INICIO_NS) / 1000000 ))
          echo 'run_id,modo,repeticao,sha,checkout_ms,total_ms' > resultado.csv
          echo "$GITHUB_RUN_ID,$MODO,$REPETICAO,$(git rev-parse HEAD),$checkout_ms,$total_ms" >> resultado.csv
          cat resultado.csv | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.modo }}-${{ matrix.repeticao }}
          path: resultado.csv
